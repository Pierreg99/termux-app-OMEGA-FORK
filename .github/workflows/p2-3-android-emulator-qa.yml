name: OMEGA P2.3 Android Emulator QA

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  android-emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb devices
            adb shell settings put system screen_brightness 128
            adb shell settings put system screen_off_timeout 1800000
            APK=$(find app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.termux
            adb shell monkey -p com.termux 1
            sleep 8
            mkdir -p qa/screenshots/p2.3
            adb exec-out screencap -p > qa/screenshots/p2.3/command-center-portrait.png
            adb shell settings put system user_rotation 1 || true
            sleep 2
            adb exec-out screencap -p > qa/screenshots/p2.3/command-center-landscape.png

      - name: Upload Android screenshot evidence
        uses: actions/upload-artifact@v5
        with:
          name: omega-p2.3-android-screenshots
          path: qa/screenshots/p2.3/*.png
          if-no-files-found: error

      - name: Upload runtime metadata
        uses: actions/upload-artifact@v5
        with:
          name: omega-p2.3-runtime-metadata
          path: |
            app/build/outputs/apk/**/*.apk
            qa/P2.3-ANDROID-QA-RESULTS.md
          if-no-files-found: warn
