name: OMEGA Core Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  core-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: JVM tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Validate build outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/reports/tests/testDebugUnitTest/index.html
          echo "OMEGA core validation outputs present"
